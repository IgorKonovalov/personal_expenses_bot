services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # The droplet's RAM is shared with sibling bots, each capped the same way, so a spike here
    # can't push the kernel into OOM-killing one of them. Standalone compose honours mem_limit.
    # A 2560 px receipt photo's QR retry peaks at up to 315 MiB (src/fiscal/qrPixels.ts has the
    # numbers per size), so 384m leaves about 70 MiB of headroom; 256m OOM-kills a 2560x2560 one.
    mem_limit: 384m
    # Overrides .env: the database and the heartbeat always land on the bot-data volume, and the
    # backups in the bind-mounted host directory.
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
      - BACKUP_DIR=/var/backups/personal-expenses-bot
    volumes:
      - bot-data:/app/data
      - ${HOST_BACKUP_DIR:-/var/backups/personal-expenses-bot}:/var/backups/personal-expenses-bot
    # The bot long-polls with no HTTP port: health is the heartbeat file next to DATABASE_PATH,
    # rewritten every 30 s once polling starts. Older than 120 s or missing is unhealthy.
    healthcheck:
      test: ['CMD', 'node', 'dist/heartbeat.js', '/app/data/heartbeat']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  bot-data:
