name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deploys queue instead of overlapping: a second `docker compose up --build` racing the first can
# leave a half-built image or a stale container running.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from package.json `packageManager`. It runs before setup-node so
      # `cache: pnpm` finds pnpm on PATH.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Emits dist/ so an emit-only failure breaks CI rather than the image build on the VPS.
      - run: pnpm build
      - run: pnpm test
      - run: node --test "scripts/*.test.mjs"

  deploy:
    needs: check
    # Pull requests run `check` as the merge gate; only a push to main reaches the server.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # The key is bound to a forced command on the VPS (scripts/deploy-vps.sh, installed as
          # ~/bin/deploy-personal-expenses-bot), which runs the deploy and ignores this script.
          script: deploy
