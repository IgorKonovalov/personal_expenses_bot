name: Pages

# Publishes one artifact to GitHub Pages: the static Mini App page (webapp/, ADR-0025) at the
# root and the docs site (site/, ADR-0048) under docs/. Neither holds data or secrets: they serve
# the same files to everyone. Pull requests run the build as a check and never deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One publish at a time; a newer push supersedes a queued one, never one in flight. A pull
# request builds in a group of its own, so it never queues behind a publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      # The bot's dev dependencies: the chat generator runs the real bot in memory.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm build:webapp
      - run: pnpm docs:chats
      - run: pnpm --dir site build
      - name: Assemble the Mini App at the root and the docs under docs/
        run: |
          mkdir -p .pages/docs
          cp -R webapp/dist/. .pages/
          cp -R site/dist/. .pages/docs/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .pages

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
